name: Chocolícia - gerar e publicar receita

on:
  schedule:
    # 08:00 no horário de Brasília (UTC-3).
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Executar todas as etapas sem enviar ao site
        type: boolean
        required: true
        default: false
      assunto:
        description: Tema da receita; automatico escolhe uma pauta
        type: string
        required: true
        default: automatico

permissions:
  contents: read

concurrency:
  group: chocolicia-receita-publicacao
  cancel-in-progress: false

jobs:
  receita:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 45
    env:
      CI: "true"
      PYTHON_DOTENV_DISABLED: "1"
      AGENT_ENABLED: "true"
      AGENT_PHASE: "0"
      AGENT_ENV: preview
      AGENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TARGET: preview
      DRY_RUN: ${{ inputs.dry_run || false }}
      CONTRACT_VERSION: "1"
      SITE_CONTRACT: v1
      SITE_BASE_URL_PREVIEW: ${{ vars.SITE_BASE_URL_PREVIEW }}
      SITE_TOKEN_DRAFT_PREVIEW: ${{ secrets.SITE_TOKEN_DRAFT_PREVIEW }}
      AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
      AGENT_PUBLISHING_ENABLED: "false"
      CHOCOLICIA_COVER_JSON: ${{ secrets.CHOCOLICIA_COVER_JSON }}
      SEARCH_PROVIDER: brave
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      AGENT_IMAGE_GENERATION_ENABLED: "false"
      ASSUNTO: ${{ inputs.assunto || 'automatico' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar configuração
        shell: bash
        run: |
          set -euo pipefail
          for name in SITE_BASE_URL_PREVIEW BRAVE_SEARCH_API_KEY AGENT_DATABASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Segredo/configuração ausente: ${name}"
              exit 1
            fi
          done

      - name: Verificar sintaxe e contrato
        run: |
          python -m compileall -q agents integration pipeline runtime_adapters services validators rodar_agente.py
          python -m integration.contratos --verificar

      - name: Executar pipeline Python de receita
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python rodar_agente.py --receita --target preview --assunto "$ASSUNTO" > output/resultado-receita.json

      - name: Confirmar resultado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          with open("output/resultado-receita.json", encoding="utf-8-sig") as f:
              result = json.load(f)
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          if result.get("estado") not in {"generated", "sent"}:
              raise SystemExit(f"Pipeline não confirmou geração/envio: {result.get('estado')} / {result.get('motivos')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Receita\n- Estado: {result.get('estado')}\n- Tema: {(result.get('pauta') or {}).get('tema', 'não informado')}\n")
          PY
