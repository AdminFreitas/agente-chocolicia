name: Testes unitários do agente

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/dica-articles-site
      - fix/gemini-client-lifecycle

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Executar testes unitários sem chamadas externas
        run: |
          python -m pytest -q \
            tests/test_dica.py \
            tests/test_site_client.py \
            tests/test_llm_service.py \
            tests/test_agente_receitas_llm_service.py \
            tests/test_pixabay_service.py \
            tests/test_hardening.py
