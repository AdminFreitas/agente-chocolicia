name: Gerar receita (Agente Chocolícia)

# O agente Python gera, valida e publica a receita pela API do site.
# Este workflow não solicita geração ao backend do site.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema da receita"
        type: string
        required: true
        default: "bolo de chocolate"
      subcategoria:
        description: "Slug da subcategoria cadastrada no site"
        type: string
        required: true
        default: "bolos-de-chocolate"
      target:
        description: "Ambiente de destino"
        type: choice
        options:
          - preview
          - producao
        default: preview
      dry_run:
        description: "Gera e valida sem enviar ao site"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: agente-chocolicia-gerar
  cancel-in-progress: false

jobs:
  receita:
    if: ${{ vars.AGENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target || vars.TARGET || 'preview' }}
      TEMA: ${{ inputs.tema || vars.RECIPE_TOPIC || 'bolo de chocolate' }}
      SUBCATEGORIA: ${{ inputs.subcategoria || vars.RECIPE_SUBCATEGORY || 'bolos-de-chocolate' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      AGENT_PHASE: ${{ vars.AGENT_PHASE || '1' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SITE_BASE_URL_PROD: ${{ vars.SITE_BASE_URL }}
      SITE_BASE_URL_PREVIEW: ${{ vars.SITE_BASE_URL_PREVIEW }}
      SITE_TOKEN_PUBLISH_PROD: ${{ secrets.SITE_TOKEN_PUBLISH }}
      SITE_TOKEN_PUBLISH_PREVIEW: ${{ secrets.SITE_TOKEN_PUBLISH_PREVIEW }}
      SITE_TOKEN_DRAFT_PROD: ${{ secrets.SITE_TOKEN_DRAFT }}
      SITE_TOKEN_DRAFT_PREVIEW: ${{ secrets.SITE_TOKEN_DRAFT_PREVIEW }}
      CHOCOLICIA_COVER_JSON: ${{ vars.CHOCOLICIA_COVER_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar e publicar receita pelo agente
        shell: bash
        run: |
          set -euo pipefail
          if [ "${TARGET}" = "preview" ]; then
            export SITE_BASE_URL="${SITE_BASE_URL_PREVIEW}"
            export SITE_TOKEN_PUBLISH="${SITE_TOKEN_PUBLISH_PREVIEW}"
            export SITE_TOKEN_DRAFT="${SITE_TOKEN_DRAFT_PREVIEW}"
          else
            export SITE_BASE_URL="${SITE_BASE_URL_PROD}"
            export SITE_TOKEN_PUBLISH="${SITE_TOKEN_PUBLISH_PROD}"
            export SITE_TOKEN_DRAFT="${SITE_TOKEN_DRAFT_PROD}"
          fi

          if [ -z "${SITE_BASE_URL}" ]; then
            echo "::error::URL do ambiente Chocolícia não configurada."
            exit 1
          fi

          ARGS=(--tipo receita --tema "${TEMA}" --subcategoria "${SUBCATEGORIA}")
          if [ "${DRY_RUN}" != "true" ]; then
            ARGS+=(--send --publish)
          fi
          python rodar_conteudo.py "${ARGS[@]}"
