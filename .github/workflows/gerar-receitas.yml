name: Gerar receita (Chocolícia)

# Este workflow aciona o backend do site. Não gera receita localmente.
# 08h em Brasília = 11h UTC. Antes de habilitar AGENT_ENABLED, desative
# o cron /api/recipes/generate-daily no vercel.json/Vercel para evitar duplicidade.
# CRON_SECRET deve ser igual ao segredo configurado no projeto Vercel do site.
# CHOCOLICIA_SITE_URL é opcional; padrão https://www.chocolicia.site.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar configuração sem acionar o site"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: agente-chocolicia-gerar
  cancel-in-progress: false

jobs:
  receita:
    if: ${{ vars.AGENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHOCOLICIA_SITE_URL: ${{ vars.CHOCOLICIA_SITE_URL || 'https://www.chocolicia.site' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar configuração
        if: ${{ inputs.dry_run }}
        run: python scripts/gerar_receita_blog.py --dry-run

      - name: Acionar geração no backend do site
        if: ${{ !inputs.dry_run }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/gerar_receita_blog.py
