name: Chocolícia - gerar dicas

on:
  schedule:
    - cron: "0 12 * * 2,5"
  workflow_dispatch:
    inputs:
      assunto:
        description: Assunto de docs/04 §6.7
        type: choice
        options:
          - preparo
          - montagem-e-apresentacao
          - ornamentacao
          - equipamentos-uso
          - equipamentos-compra
          - negocios
        default: preparo
        required: true

permissions:
  contents: read

concurrency:
  group: chocolicia-dicas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dica:
    if: >-
      ${{
        vars.AGENT_ENABLED == 'true' &&
        vars.AGENT_DICAS_ENABLED == 'true' &&
        vars.AGENT_INTERNAL_CONTENT_READY == 'true' &&
        vars.SITE_ARTICLES_ENABLED == 'true' &&
        (
          (github.event_name == 'schedule' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: [self-hosted, windows, x64, ollama]
    environment: preview
    timeout-minutes: 45
    env:
      CI: "true"
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
      AGENT_PHASE: ${{ vars.AGENT_PHASE || '0' }}
      AGENT_ENV: preview
      AGENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TARGET: preview
      DRY_RUN: "true"
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL_PREVIEW }}
      SITE_CONTRACT: legacy
      SITE_ARTICLES_ENABLED: "false"
      DATABASE_URL_AGENTE: ${{ secrets.DATABASE_URL_AGENTE }}
      ASSUNTO: ${{ inputs.assunto || 'preparo' }}
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      LLM_MODEL_CREATION: ${{ vars.OLLAMA_CREATION_MODEL || vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      LLM_FAMILY_CREATION: ${{ vars.OLLAMA_CREATION_FAMILY }}
      LLM_MODEL_REVIEW: ${{ vars.OLLAMA_REVIEW_MODEL }}
      LLM_FAMILY_REVIEW: ${{ vars.OLLAMA_REVIEW_FAMILY }}
      LLM_MODEL_SEO: ${{ vars.OLLAMA_SEO_MODEL }}
      LLM_FAMILY_SEO: ${{ vars.OLLAMA_SEO_FAMILY }}
      LLM_MODEL_EXTRACTION: ${{ vars.OLLAMA_EXTRACTION_MODEL }}
      LLM_FAMILY_EXTRACTION: ${{ vars.OLLAMA_EXTRACTION_FAMILY }}
      LLM_MODEL_VISION: ${{ vars.OLLAMA_VISION_MODEL }}
      LLM_FAMILY_VISION: ${{ vars.OLLAMA_VISION_FAMILY }}
      LLM_REQUEST_TIMEOUT: "180"
      SEARCH_PROVIDER: brave
      BRAVE_SEARCH_API_KEY: ${{ secrets.PESQUISA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_ENABLED: "true"
      PIXABAY_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar configuração sem exibir credenciais
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("SITE_BASE_URL", "BRAVE_SEARCH_API_KEY")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configuração obrigatória ausente: $name."
            }
          }

      - name: Executar pipeline de dica em dry-run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          python rodar_agente.py --dica --target preview --assunto $env:ASSUNTO |
            Tee-Object -FilePath output\resultado-dica.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resultado = Get-Content output\resultado-dica.json -Raw | ConvertFrom-Json
          if ($resultado.estado -ne "generated") {
            throw "Dry-run não concluiu geração e validação da dica."
          }
          @(
            "### Execução de dica"
            "- Resultado: $($resultado.estado)"
            "- Assunto: $($resultado.pauta.assunto)"
            "- Slug: $($resultado.pauta.topic_slug)"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
