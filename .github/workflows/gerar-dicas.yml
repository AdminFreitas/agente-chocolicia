name: Gerar dica (Chocolícia)

# Roda às terças e sextas, 09h em Brasília (12h UTC; Brasil em UTC-3, sem
# horário de verão).
#
# Fica DESLIGADO até as variáveis do repositório AGENT_ENABLED e
# AGENT_DICAS_ENABLED valerem "true".
# Os tokens SITE_TOKEN_* devem ter o MESMO valor do RECIPES_AGENT_TOKEN configurado no
# site (nunca CRON_SECRET). Endpoint: POST {SITE_BASE_URL}/api/articles.

on:
  schedule:
    - cron: "0 12 * * 2,5"
  workflow_dispatch:
    inputs:
      assunto:
        description: "Assunto da dica (automatico deixa o planejador escolher)"
        type: choice
        options:
          - automatico
          - preparo
          - montagem-e-apresentacao
          - ornamentacao
          - equipamentos-uso
          - equipamentos-compra
          - negocios
        default: automatico
      dry_run:
        description: "Gera e valida, mas não envia ao site"
        type: boolean
        default: true
      target:
        description: "Ambiente de destino"
        type: choice
        options:
          - preview
          - producao
        default: preview

permissions:
  contents: read

# Mesmo grupo das receitas: nunca há duas execuções do agente ao mesmo tempo.
concurrency:
  group: agente-chocolicia-gerar
  cancel-in-progress: false

jobs:
  dica:
    if: ${{ vars.AGENT_ENABLED == 'true' && vars.AGENT_DICAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # --- Execução ---
      TARGET: ${{ inputs.target || 'producao' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      ASSUNTO: ${{ inputs.assunto || 'automatico' }}
      AGENT_PHASE: ${{ vars.AGENT_PHASE || '0' }}
      CONTRACT_VERSION: "1"

      # --- Site (o agente só fala com o site por API) ---
      SITE_BASE_URL_PROD: ${{ vars.SITE_BASE_URL }}
      SITE_BASE_URL_PREVIEW: ${{ vars.SITE_BASE_URL_PREVIEW }}
      SITE_TOKEN_DRAFT_PROD: ${{ secrets.SITE_TOKEN_DRAFT }}
      SITE_TOKEN_PUBLISH_PROD: ${{ secrets.SITE_TOKEN_PUBLISH }}
      SITE_TOKEN_DRAFT_PREVIEW: ${{ secrets.SITE_TOKEN_DRAFT_PREVIEW }}

      # --- Provedores de IA (somente os da lista de modelos aprovados) ---
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # --- Pesquisa na web ---
      PESQUISA_PROVEDOR: ${{ vars.PESQUISA_PROVEDOR }}
      PESQUISA_API_KEY: ${{ secrets.PESQUISA_API_KEY }}

      # --- Imagens (bancos de imagens) ---
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar dica
        shell: bash
        run: |
          set -euo pipefail

          if [ "${TARGET}" = "preview" ]; then
            export SITE_BASE_URL="${SITE_BASE_URL_PREVIEW}"
            export SITE_TOKEN_DRAFT="${SITE_TOKEN_DRAFT_PREVIEW}"
            unset SITE_TOKEN_PUBLISH || true
          else
            export SITE_BASE_URL="${SITE_BASE_URL_PROD}"
            export SITE_TOKEN_DRAFT="${SITE_TOKEN_DRAFT_PROD}"
            if [ "${AGENT_PHASE}" != "0" ]; then
              export SITE_TOKEN_PUBLISH="${SITE_TOKEN_PUBLISH_PROD}"
            fi
          fi

          ARGS="--dica --target ${TARGET}"
          if [ "${ASSUNTO}" != "automatico" ]; then
            ARGS="${ARGS} --assunto ${ASSUNTO}"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi

          python rodar_agente.py ${ARGS}

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |
          if [ -f output/resumo-execucao.md ]; then
            cat output/resumo-execucao.md >> "$GITHUB_STEP_SUMMARY"
          fi
