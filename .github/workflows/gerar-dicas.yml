name: Gerar dica (Chocolícia)

# Execução manual e controlada somente no Preview.
# O agente envia dicas exclusivamente para POST /api/tips.
# dry_run=true e publish=false são os padrões seguros; publicar exige seleção explícita.

on:
  workflow_dispatch:
    inputs:
      assunto:
        description: "Assunto da dica (automatico deixa o planejador escolher)"
        type: choice
        options:
          - automatico
          - preparo
          - montagem-e-apresentacao
          - ornamentacao
          - equipamentos-uso
          - equipamentos-compra
          - negocios
        default: automatico
      dry_run:
        description: "Gera e valida, mas não envia ao site"
        type: boolean
        default: true
      publish:
        description: "Publica em vez de criar rascunho (somente quando autorizado)"
        type: boolean
        default: false
      target:
        description: "Ambiente de destino"
        type: choice
        options:
          - preview
        default: preview

permissions:
  contents: read
  id-token: write

# Mesmo grupo das receitas: nunca há duas execuções do agente ao mesmo tempo.
concurrency:
  group: agente-chocolicia-gerar
  cancel-in-progress: false

jobs:
  dica:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # --- Execução ---
      TARGET: preview
      DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
      PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
      ASSUNTO: ${{ inputs.assunto || 'automatico' }}
      CONTRACT_VERSION: "1"
      AGENT_PHASE: "1"

      # --- Site (o agente só fala com o site por API) ---
      SITE_BASE_URL_PROD: ${{ vars.SITE_BASE_URL }}
      SITE_BASE_URL_PREVIEW: https://chocolicia-git-fix-neon-tips-335ad2-chocoliciaartedosdoces-9565.vercel.app
      SITE_TOKEN_DRAFT_PROD: ${{ secrets.SITE_TOKEN_DRAFT }}
      SITE_TOKEN_DRAFT_PREVIEW: ${{ secrets.SITE_TOKEN_DRAFT_PREVIEW }}
      SITE_TOKEN_PUBLISH_PROD: ${{ secrets.SITE_TOKEN_PUBLISH }}
      SITE_TOKEN_PUBLISH_PREVIEW: ${{ secrets.SITE_TOKEN_PUBLISH_PREVIEW }}

      # --- Provedores de IA (somente os da lista de modelos aprovados) ---
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # --- Pesquisa na web ---
      PESQUISA_PROVEDOR: ${{ vars.PESQUISA_PROVEDOR }}
      PESQUISA_API_KEY: ${{ secrets.PESQUISA_API_KEY }}

      # --- Imagens (bancos de imagens) ---
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CHOCOLICIA_COVER_JSON: ${{ vars.CHOCOLICIA_COVER_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Emitir identidade OIDC para Vercel
        id: vercel-oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Gerar dica
        shell: bash
        run: |
          set -euo pipefail
          export VERCEL_TRUSTED_OIDC_TOKEN="${{ steps.vercel-oidc.outputs.token }}"

          if [ "${TARGET}" = "preview" ]; then
            export SITE_BASE_URL="${SITE_BASE_URL_PREVIEW}"
            export SITE_TOKEN_DRAFT="${SITE_TOKEN_DRAFT_PREVIEW}"
          else
            export SITE_BASE_URL="${SITE_BASE_URL_PROD}"
            export SITE_TOKEN_DRAFT="${SITE_TOKEN_DRAFT_PROD}"
          fi

          if [ -z "${SITE_BASE_URL}" ]; then
            echo "::error::SITE_BASE_URL do ambiente escolhido não está configurada."
            exit 1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ -z "${SITE_TOKEN_DRAFT}" ]; then
            echo "::error::Token de rascunho ausente. Configure SITE_TOKEN_DRAFT com o mesmo valor de TIPS_AGENT_TOKEN (ou RECIPES_AGENT_TOKEN, quando compartilhado) do site."
            exit 1
          fi
          ARGS=(--assunto "${ASSUNTO}" --target "${TARGET}")
          if [ "${PUBLISH}" = "true" ] && [ "${DRY_RUN}" != "true" ]; then
            ARGS+=(--publish)
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          python -m pipeline.gerar_dica "${ARGS[@]}"

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |
          if [ -f output/resumo-execucao.md ]; then
            cat output/resumo-execucao.md >> "$GITHUB_STEP_SUMMARY"
          fi
