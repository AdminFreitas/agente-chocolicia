name: Verificar acesso OIDC ao Preview (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_PREVIEW_URL: ${{ vars.SITE_BASE_URL_PREVIEW }}
    steps:
      - name: Emitir identidade OIDC do GitHub Actions
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Consultar dicas e receitas do Preview (GET)
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SITE_PREVIEW_URL}" ]; then
            echo "::error::Configure a variável SITE_BASE_URL_PREVIEW do GitHub Actions."
            exit 1
          fi
          for endpoint in "/api/tips?limit=1" "/api/recipes?limit=1"; do
            response="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}" \
              "${SITE_PREVIEW_URL%/}${endpoint}")"
            echo "${endpoint}: HTTP ${status}"
            cat "$response"
            test "$status" = "200"
            jq -e '.items | type == "array"' "$response" >/dev/null
          done
          echo "Consultas GET concluídas; nenhum conteúdo foi criado ou publicado."

      - name: Confirmar autenticação dos endpoints de ingestão (POST inválido)
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in tips recipes; do
            response="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response" \
              --write-out "%{http_code}" \
              --request POST \
              --header "x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}" \
              --header "Authorization: Bearer diagnostic-invalid-token-never-valid" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "${SITE_PREVIEW_URL%/}/api/${endpoint}")"
            echo "${endpoint}: HTTP ${status}"
            cat "$response"
            test "$status" = "401"
            jq -e '.code == "unauthorized"' "$response" >/dev/null
          done
          echo "As duas rotas rejeitaram Bearer inválido; nenhum registro foi gravado."
